<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Line chart of frames drawn per second against CPU slowdown.">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<rect width="720" height="300" rx="12" fill="var(--surface)"/>
<text class="title" x="24" y="34">On a slower CPU the frame rate drops, nothing breaks</text>
<text class="sub" x="24" y="54">Frames drawn per second at 1366×768 as the CPU is slowed down (Chromium CPU throttling, software drawing).</text>
<line class="axis" x1="64" x2="680" y1="244" y2="244"/><text class="tick" x="56" y="248" text-anchor="end">0</text><line class="grid" x1="64" x2="680" y1="204" y2="204"/><text class="tick" x="56" y="208" text-anchor="end">10</text><line class="grid" x1="64" x2="680" y1="164" y2="164"/><text class="tick" x="56" y="168" text-anchor="end">20</text><line class="grid" x1="64" x2="680" y1="124" y2="124"/><text class="tick" x="56" y="128" text-anchor="end">30</text><line class="grid" x1="64" x2="680" y1="84" y2="84"/><text class="tick" x="56" y="88" text-anchor="end">40</text><line x1="64" x2="680" y1="124" y2="124" stroke="var(--ink2)" stroke-width="1"/><text class="tick" x="680" y="118" text-anchor="end">cap: 30 fps</text><polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="64,124 187.2,162.8 433.6,207.6 680,220.4"/><circle cx="64" cy="124" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="val" x="64" y="114" text-anchor="middle">30</text><circle cx="187.2" cy="162.8" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="val" x="187.2" y="152.8" text-anchor="middle">20</text><circle cx="433.6" cy="207.6" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="val" x="433.6" y="197.6" text-anchor="middle">9</text><circle cx="680" cy="220.4" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="val" x="680" y="210.4" text-anchor="middle">6</text><text class="tick" x="64" y="262" text-anchor="middle">this machine</text><text class="tick" x="187.2" y="262" text-anchor="middle">2× slower</text><text class="tick" x="433.6" y="262" text-anchor="middle">4× slower</text><text class="tick" x="680" y="262" text-anchor="middle">6× slower</text>
</svg>
