<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Stacked columns of main-thread time by screen size.">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<rect width="720" height="340" rx="12" fill="var(--surface)"/>
<text class="title" x="24" y="34">Bigger screens cost more pixels</text>
<text class="sub" x="24" y="54">Main-thread time at 30 fps by canvas size, light theme.</text>
<rect x="24" y="71" width="10" height="10" rx="2" fill="var(--s1)"/><text x="40" y="80">Page script (what a machine with a GPU pays)</text><rect x="364" y="71" width="10" height="10" rx="2" fill="var(--s2)"/><text x="380" y="80">Drawing pixels in software (no GPU)</text><line class="axis" x1="64" x2="696" y1="290" y2="290"/><text class="tick" x="56" y="294" text-anchor="end">0%</text><line class="grid" x1="64" x2="696" y1="243.5" y2="243.5"/><text class="tick" x="56" y="247.5" text-anchor="end">25%</text><line class="grid" x1="64" x2="696" y1="197" y2="197"/><text class="tick" x="56" y="201" text-anchor="end">50%</text><line class="grid" x1="64" x2="696" y1="150.5" y2="150.5"/><text class="tick" x="56" y="154.5" text-anchor="end">75%</text><line class="grid" x1="64" x2="696" y1="104" y2="104"/><text class="tick" x="56" y="108" text-anchor="end">100%</text><path fill="var(--s1)" d="M137,290 V258.194 Q137,258.194 137,258.194 H161 Q161,258.194 161,258.194 V290 Z"/><path fill="var(--s2)" d="M137,256.194 V164.172 Q137,160.172 141,160.172 H157 Q161,160.172 161,164.172 V256.194 Z"/><text class="val" x="149" y="154.172" text-anchor="middle">70%</text><text class="tick" x="149" y="308" text-anchor="middle">1366×768</text><path fill="var(--s1)" d="M291,290 V258.38 Q291,258.38 291,258.38 H315 Q315,258.38 315,258.38 V290 Z"/><path fill="var(--s2)" d="M291,256.38 V152.826 Q291,148.826 295,148.826 H311 Q315,148.826 315,152.826 V256.38 Z"/><text class="val" x="303" y="142.826" text-anchor="middle">76%</text><text class="tick" x="303" y="308" text-anchor="middle">1600×860</text><path fill="var(--s1)" d="M445,290 V258.938 Q445,258.938 445,258.938 H469 Q469,258.938 469,258.938 V290 Z"/><path fill="var(--s2)" d="M445,256.938 V129.39 Q445,125.38999999999999 449,125.38999999999999 H465 Q469,125.38999999999999 469,129.39 V256.938 Z"/><text class="val" x="457" y="119.38999999999999" text-anchor="middle">89%</text><text class="tick" x="457" y="308" text-anchor="middle">1920×1080</text><path fill="var(--s1)" d="M599,290 V168.542 Q599,168.542 599,168.542 H623 Q623,168.542 623,168.542 V290 Z"/><path fill="var(--s2)" d="M599,166.542 V108.93 Q599,104.93 603,104.93 H619 Q623,104.93 623,108.93 V166.542 Z"/><text class="val" x="611" y="98.93" text-anchor="middle">100%</text><text class="tick" x="611" y="308" text-anchor="middle">2560×1440</text><text class="tick" x="64" y="326">Share of one CPU core the page's main thread is busy</text>
</svg>
