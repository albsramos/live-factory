<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-label="Bar chart of browser CPU on screen, idle, scrolled out of view and for an empty tab.">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<rect width="720" height="236" rx="12" fill="var(--surface)"/>
<text class="title" x="24" y="34">When nobody is looking, it costs nothing</text>
<text class="sub" x="24" y="54">The scene stops when scrolled out of view, in a hidden tab, and after 5 minutes without input.</text>
<text x="218" y="99" text-anchor="end">On screen</text><path fill="var(--s1)" d="M230,86 H513 Q517,86 517,90 V102 Q517,106 513,106 H230 Z"/><text class="val" x="525" y="100">70.0%</text><text x="218" y="133" text-anchor="end">Nobody at the page for 5 min</text><path fill="var(--s1)" d="M230,120 H231.025 Q232.05,120 232.05,121.025 V138.975 Q232.05,140 231.025,140 H230 Z"/><text class="val" x="240.05" y="134">0.5%</text><text x="218" y="167" text-anchor="end">Scrolled out of view</text><path fill="var(--s1)" d="M230,154 H231 Q232,154 232,155 V173 Q232,174 231,174 H230 Z"/><text class="val" x="240" y="168">0.2%</text><text x="218" y="201" text-anchor="end">Empty tab, for comparison</text><path fill="var(--s1)" d="M230,188 H231 Q232,188 232,189 V207 Q232,208 231,208 H230 Z"/><text class="val" x="240" y="202">0.0%</text><text class="tick" x="24" y="222">CPU time of the whole browser (every process), share of one core: the demo website at 1366×768, no GPU.</text>
</svg>
