<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-label="Stacked columns of main-thread time by frame cap for the light and dark themes.">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<rect width="720" height="364" rx="12" fill="var(--surface)"/>
<text class="title" x="24" y="34">Fewer frames, less work</text>
<text class="sub" x="24" y="54">Main-thread time at 1600×860 by frame cap, in each theme (lower is better). 30 fps is the default.</text>
<rect x="24" y="71" width="10" height="10" rx="2" fill="var(--s1)"/><text x="40" y="80">Page script (what a machine with a GPU pays)</text><rect x="364" y="71" width="10" height="10" rx="2" fill="var(--s2)"/><text x="380" y="80">Drawing pixels in software (no GPU)</text><line class="axis" x1="64" x2="696" y1="314" y2="314"/><text class="tick" x="56" y="318" text-anchor="end">0%</text><line class="grid" x1="64" x2="696" y1="267.5" y2="267.5"/><text class="tick" x="56" y="271.5" text-anchor="end">25%</text><line class="grid" x1="64" x2="696" y1="221" y2="221"/><text class="tick" x="56" y="225" text-anchor="end">50%</text><line class="grid" x1="64" x2="696" y1="174.5" y2="174.5"/><text class="tick" x="56" y="178.5" text-anchor="end">75%</text><line class="grid" x1="64" x2="696" y1="128" y2="128"/><text class="tick" x="56" y="132" text-anchor="end">100%</text><text class="val" x="222" y="104" text-anchor="middle">Light theme</text><path fill="var(--s1)" d="M97.5,314 V271.592 Q97.5,271.592 97.5,271.592 H121.5 Q121.5,271.592 121.5,271.592 V314 Z"/><path fill="var(--s2)" d="M97.5,269.592 V132.558 Q97.5,128.558 101.5,128.558 H117.5 Q121.5,128.558 121.5,132.558 V269.592 Z"/><text class="val" x="109.5" y="122.55799999999999" text-anchor="middle">100%</text><text class="tick" x="109.5" y="332" text-anchor="middle">every refresh</text><path fill="var(--s1)" d="M172.5,314 V282.56600000000003 Q172.5,282.56600000000003 172.5,282.56600000000003 H196.5 Q196.5,282.56600000000003 196.5,282.56600000000003 V314 Z"/><path fill="var(--s2)" d="M172.5,280.56600000000003 V178.5 Q172.5,174.5 176.5,174.5 H192.5 Q196.5,174.5 196.5,178.5 V280.56600000000003 Z"/><text class="val" x="184.5" y="168.5" text-anchor="middle">75%</text><text class="tick" x="184.5" y="332" text-anchor="middle">30 fps</text><path fill="var(--s1)" d="M247.5,314 V291.68 Q247.5,291.68 247.5,291.68 H271.5 Q271.5,291.68 271.5,291.68 V314 Z"/><path fill="var(--s2)" d="M247.5,289.68 V219.792 Q247.5,215.792 251.5,215.792 H267.5 Q271.5,215.792 271.5,219.792 V289.68 Z"/><text class="val" x="259.5" y="209.792" text-anchor="middle">53%</text><text class="tick" x="259.5" y="332" text-anchor="middle">20 fps</text><path fill="var(--s1)" d="M322.5,314 V294.47 Q322.5,294.47 322.5,294.47 H346.5 Q346.5,294.47 346.5,294.47 V314 Z"/><path fill="var(--s2)" d="M322.5,292.47 V234.858 Q322.5,230.858 326.5,230.858 H342.5 Q346.5,230.858 346.5,234.858 V292.47 Z"/><text class="val" x="334.5" y="224.858" text-anchor="middle">45%</text><text class="tick" x="334.5" y="332" text-anchor="middle">15 fps</text><text class="val" x="538" y="104" text-anchor="middle">Dark theme</text><path fill="var(--s1)" d="M413.5,314 V285.542 Q413.5,285.542 413.5,285.542 H437.5 Q437.5,285.542 437.5,285.542 V314 Z"/><path fill="var(--s2)" d="M413.5,283.542 V132.18599999999998 Q413.5,128.18599999999998 417.5,128.18599999999998 H433.5 Q437.5,128.18599999999998 437.5,132.18599999999998 V283.542 Z"/><text class="val" x="425.5" y="122.18599999999998" text-anchor="middle">100%</text><text class="tick" x="425.5" y="332" text-anchor="middle">every refresh</text><path fill="var(--s1)" d="M488.5,314 V285.914 Q488.5,285.914 488.5,285.914 H512.5 Q512.5,285.914 512.5,285.914 V314 Z"/><path fill="var(--s2)" d="M488.5,283.914 V132.74400000000003 Q488.5,128.74400000000003 492.5,128.74400000000003 H508.5 Q512.5,128.74400000000003 512.5,132.74400000000003 V283.914 Z"/><text class="val" x="500.5" y="122.74400000000003" text-anchor="middle">100%</text><text class="tick" x="500.5" y="332" text-anchor="middle">30 fps</text><path fill="var(--s1)" d="M563.5,314 V290.378 Q563.5,290.378 563.5,290.378 H587.5 Q587.5,290.378 587.5,290.378 V314 Z"/><path fill="var(--s2)" d="M563.5,288.378 V157.11 Q563.5,153.11 567.5,153.11 H583.5 Q587.5,153.11 587.5,157.11 V288.378 Z"/><text class="val" x="575.5" y="147.11" text-anchor="middle">87%</text><text class="tick" x="575.5" y="332" text-anchor="middle">20 fps</text><path fill="var(--s1)" d="M638.5,314 V295.586 Q638.5,295.586 638.5,295.586 H662.5 Q662.5,295.586 662.5,295.586 V314 Z"/><path fill="var(--s2)" d="M638.5,293.586 V196.728 Q638.5,192.728 642.5,192.728 H658.5 Q662.5,192.728 662.5,196.728 V293.586 Z"/><text class="val" x="650.5" y="186.728" text-anchor="middle">65%</text><text class="tick" x="650.5" y="332" text-anchor="middle">15 fps</text><text class="tick" x="64" y="350">Share of one CPU core the page's main thread is busy</text>
</svg>
