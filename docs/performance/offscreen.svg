<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Bar chart: browser CPU on screen, scrolled out of view, and for an empty tab.">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<rect width="720" height="200" rx="12" fill="var(--surface)"/>
<text class="title" x="24" y="34">Out of view, it costs nothing</text>
<text class="sub" x="24" y="54">The scene stops its frame loop as soon as it leaves the screen.</text>
<text x="198" y="99" text-anchor="end">On screen</text><path fill="var(--s1)" d="M210,86 H547.85 Q551.85,86 551.85,90 V102 Q551.85,106 547.85,106 H210 Z"/><text class="val" x="559.85" y="100">79.5%</text><text x="198" y="133" text-anchor="end">Scrolled out of view</text><path fill="var(--s1)" d="M210,120 H211 Q212,120 212,124 V136 Q212,140 211,140 H210 Z"/><text class="val" x="220" y="134">0.2%</text><text x="198" y="167" text-anchor="end">Empty tab, for comparison</text><path fill="var(--s1)" d="M210,154 H211 Q212,154 212,158 V170 Q212,174 211,174 H210 Z"/><text class="val" x="220" y="168">0.0%</text><text class="tick" x="24" y="186">CPU time of the whole browser (every process), share of one core, built website at 1366×768.</text>
</svg>
