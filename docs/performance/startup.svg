"/><text class="tick" x="419.07" y="164" text-anchor="middle">80</text><line x1="269.64" x2="269.64" y1="162" y2="204" stroke="var(--ink)" stroke-width="2"/><text class="tick" x="275.64" y="206">first paint 364 ms</text><text class="tick" x="24" y="262">Long tasks (over 50 ms, length in ms) on the main thread while the demo website loads at 1366×768.</text>
